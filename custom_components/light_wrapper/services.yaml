set_defaults:
  target:
    entity:
      integration: light_wrapper
      domain: light
  fields:
    default_brightness_pct:
      selector:
        number:
          min: 1
          max: 100
          step: 1
          unit_of_measurement: "%"
          mode: slider
    default_color_temp_kelvin:
      selector:
        color_temp:
          unit: kelvin
          min: 2000
          max: 6500
    default_transition_on:
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s
          mode: slider
    default_transition_off:
      selector:
        number:
          min: 0
          max: 10
          step: 0.1
          unit_of_measurement: s
          mode: slider
